name: F-Droid Repository (managed by Tickets)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-status:
    name: Confirm the existing F-Droid repository
    runs-on: ubuntu-latest
    steps:
      - name: Confirm canonical repository
        run: |
          echo "The F-Droid repository is maintained in SteveYuanlong9321/Tickets."
          echo "No separate repository index or signing key is generated from HomePage."
          echo "Canonical repository URL: https://steveyuanlong9321.github.io/Tickets/fdroid/repo/"
